name: Build and Push Image

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'

jobs:
  build:
    name: Build image and publish to registry
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ubi9-okd-tools
      REGISTRY: ghcr.io/inholland-cloud-minor-2526

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Buildah Action
      id: build-image
      uses: redhat-actions/buildah-build@9dc2ade9b5db229966b5025ae266311e12f349c4 # v2
      with:
        image: ${{ env.IMAGE_NAME }}
        tags: latest ${{ github.sha }} ${{ github.ref_name }}
        containerfiles: |
          ./Containerfile

    - name: Log in to the GitHub Container registry
      uses: redhat-actions/podman-login@4934294ad0449894bcd1e9f191899d7292469603 # v1
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Push to GitHub Container Repository
      id: push-to-ghcr
      uses: redhat-actions/push-to-registry@5860fc963bf8f2b3221773a023141612f010c469 # v2
      with:
        image: ${{ steps.build-image.outputs.image }}
        tags: ${{ steps.build-image.outputs.tags }}
        registry: ${{ env.REGISTRY }}
